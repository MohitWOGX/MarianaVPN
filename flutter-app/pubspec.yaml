name: marianavpn
description: MarianaVPN - Modern VPN App by MohitW

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  openvpn_flutter: ^1.3.4
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ovpn/mumbai.ovpn
    - assets/ovpn/singapore.ovpn
    - assets/images/icon.png
